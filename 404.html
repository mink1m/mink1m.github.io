        <section class="not-found reveal">
            <div class="not-found-content">

                    <path
                        d="M 168 356 C 235 348, 285 292, 265 232 C 245 178, 178 202, 196 258 C 214 312, 315 268, 366 174"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-dasharray="7 9"
                        stroke-linecap="round"
                    />

                    <!-- Origami Paper Airplane -->
                    <g transform="translate(388, 128) rotate(-32)" fill="none" stroke="currentColor" stroke-linejoin="round">
                        <!-- Upper Wing -->
                        <polygon points="-68,-14 68,0 -44,12" stroke-width="2.5" />

                        <polygon points="-44,12 68,0 -34,30" stroke-width="2.5" />

                        <polygon points="-34,30 68,0 -12,44" stroke-width="2.5" />
                        <!-- Underside Tail Flap -->
                        <polygon points="-44,12 -34,30 -20,21" stroke-width="2" />
                    </g>
